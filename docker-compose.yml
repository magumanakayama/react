# version: '3'
services:
  front:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - USER_UID=${UID}
        - USER_GID=${GID}
    user: "${UID}:${GID}"
    container_name: my_front
    volumes:
      - ./public:/react/public
      - ./shellscript_linux:/react/shellscript_linux
      - ./src:/react/src
      - ./package.json:/react/package.json
      - ./yarn.lock:/react/yarn.lock
      - ./node_modules:/react/node_modules
      - ./express:/react/express
    environment:
      USER_UID: ${UID}
      USER_GID: ${GID}
    ports:
      - "3000:3000"
    tty: true

  express:
    image: my-express-container
    container_name: my-express-api
    build:
      context: ./express
      dockerfile: Dockerfile
    volumes:
      - ./express/package.json:/express_app/package.json
      - ./express/index.js:/express_app/index.js
    ports:
      - "8001:8000"


  db:
    image: postgres:17-bookworm
    ports:
      - "3002:5432" # PostgreSQL のデフォルトポートは 5432
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'my_database' # 初期データベース名
    volumes:
      - postgres_data:/var/lib/postgresql/data # 起動の度にボリュームが作成されるのをを防ぐのためのボリューム
      - ./init-scripts:/docker-entrypoint-initdb.d/ # 初期化スクリプトをマウント

volumes:
  postgres_data: